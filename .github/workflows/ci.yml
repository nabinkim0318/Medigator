name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Python Tests and Linting
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set environment variables
      run: |
        echo "PYTHONPATH=." >> $GITHUB_ENV
        echo "DEMO_MODE=true" >> $GITHUB_ENV
        echo "HIPAA_MODE=false" >> $GITHUB_ENV

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install pre-commit

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

    - name: Run linting
      run: |
        ruff check api/
        ruff format --check api/

    - name: Run tests
      run: |
        PYTHONPATH=. pytest api/tests/ -v --cov=api --cov-report=xml --cov-report=html -k "not trio"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./api/coverage.xml
        flags: backend
        name: backend-coverage

  # Frontend Tests and Linting
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: |
        npm ci

    - name: Run type checking
      run: npx tsc --noEmit

    - name: Build application
      run: npm run build

  # Dependency vulnerability report. Intentionally nonblocking:
  # `safety check` currently reports many findings (torch/transformers stack).
  # Making this a gate would turn this PR into a dependency-upgrade PR.
  dependency-report:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Run dependency scan (nonblocking)
      run: |
        safety check --json --output safety-report.json || true

    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-report
        path: safety-report.json

  # PR-visible gate: build the real image, start Uvicorn, poll real HTTP health.
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build, start, and verify API health
      env:
        SMOKE_FRONTEND: "0"
        SMOKE_PERSISTENCE: "0"
      run: make docker-smoke
